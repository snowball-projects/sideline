<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#173e39" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="sideline" />
    <meta
      name="description"
      content="NFL teams, starters, injuries and pre-week league ranks. A snowball project."
    />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link
      rel="canonical"
      href="https://snowball-projects.github.io/sideline/"
    />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./apple-touch-icon.png"
    />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="styles.css" />
    <title>sideline · snowball</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to team cards</a>
    <header>
      <a class="brand" href="./"
        ><img src="icon.svg" width="34" height="34" alt="" />sideline</a
      >
      <div class="controls">
        <label class="sr-only" for="week">NFL week</label>
        <select id="week" disabled><option>Week unavailable</option></select>
        <div class="unit-switch" role="group" aria-label="Unit">
          <button id="offense" aria-pressed="true" disabled>Offense</button>
          <button id="defense" aria-pressed="false" disabled>Defense</button>
        </div>
        <label class="sr-only" for="sort">Sort teams</label>
        <select id="sort" disabled></select>
      </div>
      <div class="header-actions">
        <button id="compare" disabled>Compare</button>
        <button id="clear-compare" hidden>Clear</button>
        <button id="info" aria-label="Sources and licenses">i</button>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <h1 class="sr-only">NFL team starters and injuries</h1>
      <p id="message" role="status">Loading weekly matchups…</p>
      <div id="cards" tabindex="-1"></div>
      <section id="team-view" hidden></section>
      <noscript><p>JavaScript is required to display the cards.</p></noscript>
    </main>
    <dialog id="popup" aria-labelledby="popup-title">
      <button id="close-popup" aria-label="Close popup">×</button>
      <div id="popup-content"></div>
    </dialog>
    <script type="module" src="app.mjs"></script>
  </body>
</html>
