<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#173e39" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="sideline" />
    <meta
      name="description"
      content="NFL offenses, opposing defenses and weekly injuries. A snowball project."
    />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link
      rel="canonical"
      href="https://snowball-projects.github.io/sideline/"
    />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./apple-touch-icon.png"
    />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="styles.css" />
    <title>sideline · snowball</title>
  </head>
  <body>
    <a class="skip-link" href="#cards">Skip to team cards</a>
    <header>
      <a class="brand" href="./"
        ><img src="icon.svg" width="34" height="34" alt="" />sideline</a
      >
      <div class="controls">
        <div class="search-area">
          <label class="sr-only" for="search">NFL teams or players</label>
          <input
            id="search"
            type="search"
            placeholder="Search teams or players"
            autocomplete="off"
            spellcheck="false"
            aria-controls="results"
            aria-expanded="false"
            disabled
          />
          <div id="results" hidden></div>
        </div>
        <label class="sr-only" for="week">NFL week</label>
        <select id="week" disabled>
          <option>Week unavailable</option>
        </select>
        <p id="injury-updated"></p>
      </div>
      <button id="info" aria-label="Sources and licenses">i</button>
    </header>
    <main>
      <h1 class="sr-only">Offenses against their weekly opponents</h1>
      <p id="message" role="status">Loading weekly matchups…</p>
      <div id="cards" tabindex="-1"></div>
      <noscript><p>JavaScript is required to display the cards.</p></noscript>
    </main>
    <dialog id="popup" aria-labelledby="popup-title">
      <button id="close-popup" aria-label="Close popup">×</button>
      <div id="popup-content"></div>
    </dialog>
    <script type="module" src="app.mjs"></script>
  </body>
</html>
