name: checks and Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  unit:
    name: credential-free unit suite
    if: github.event_name != 'schedule'
    outputs:
      python: ${{ steps.changes.outputs.python }}
      browser: ${{ steps.changes.outputs.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select checks for changed files
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python=false
          browser=false
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            python=true
            browser=true
          else
            git diff --name-only -z "$BASE" "$HEAD" > "$RUNNER_TEMP/changed-files"
            while IFS= read -r -d '' path; do
              case "$path" in
                # These JSON files are checked by the Node suite and build.
                web/coordinators.json|web/team-assets.json|web/example.json|*.md) : ;;
                .github/workflows/*) python=true; browser=true ;;
                scripts/*.py|tests/*.py|requirements.txt|config/*) python=true ;;
                *) browser=true ;;
              esac
            done < "$RUNNER_TEMP/changed-files"
          fi
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "browser=$browser" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.python == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: steps.changes.outputs.python == 'true'
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        if: steps.changes.outputs.python == 'true'
        run: python -m unittest discover -s tests -v

  web:
    name: dashboard checks
    needs: unit
    if: always() && (needs.unit.result == 'success' || needs.unit.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: node --check web/app.mjs
      - run: npm run build
      - name: Collect reviewed public data
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npm run refresh
      - name: Validate publication artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npm run build:live
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
          retention-days: 1

  browser:
    name: field browser checks
    needs: unit
    if: github.event_name != 'schedule' && needs.unit.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci
      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify desktop, mobile, keyboard and interrupted field flows
        run: npm run test:browser
      - name: Retain synthetic-fixture screenshots and browser report for review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: field-browser-evidence
          path: |
            playwright-report
            test-results
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: [web, browser]
    if: ${{ !cancelled() && needs.web.result == 'success' && (needs.browser.result == 'success' || needs.browser.result == 'skipped') && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
